[project]
name = "redforge"
version = "0.1.0"
description = "RedForge: autonomous smart-contract exploit and formal-verification engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-anthropic>=0.2",
    "anthropic>=0.39",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "chromadb>=0.5",          # long-term memory (RAG over audit findings)
    "langfuse>=2.0",          # observability
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
redforge = "redforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "sandbox: requires Docker and the redforge-sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
